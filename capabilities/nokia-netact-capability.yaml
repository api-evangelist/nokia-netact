      - name: operationalState
        type: string
        description: operationalState
      - name: administrativeState
        type: string
        description: administrativeState
      - name: alarmState
        type: string
        description: alarmState
      - name: dnFilter
        type: string
        description: Distinguished Name prefix filter for topology subtree queries
      - name: limit
        type: integer
