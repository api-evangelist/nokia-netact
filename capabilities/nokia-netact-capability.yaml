        distinguishedName: tools.distinguishedName
      inputParameters:
      - name: distinguishedName
        type: string
        description: DN of the network element (URL-encoded)
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: getnetworkelementchildren
      description: Get child network elements
      hints:
        readOnly: true
