aid: nokia-netact
name: Nokia NetAct
description: >-
  Nokia NetAct is a network management system that enables operators to monitor, configure, and optimize multi-vendor
  mobile networks across radio, transport, and core domains. The northbound interface exposes REST APIs for OSS/BSS
  integration including topology, performance, fault, and configuration management.
